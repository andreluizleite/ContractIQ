name: Azure infrastructure validation

on:
  pull_request:
    paths:
      - '.github/workflows/azure-infrastructure-validation.yml'
      - 'infra/azure/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-bicep:
    name: Build Bicep without deployment
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile subscription template
        shell: bash
        run: az bicep build --file infra/azure/main.bicep --outfile "${RUNNER_TEMP}/contractiq-azure.json"
