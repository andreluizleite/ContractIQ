name: Feature
description: Propose a user-facing or architectural capability
title: "[Feature]: "
labels:
  - "type: feature"
body:
  - type: markdown
    attributes:
      value: Describe a small, testable, and demonstrable outcome.
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user or engineering problem should be solved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result without prescribing unnecessary implementation details.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use clear and independently verifiable criteria.
      placeholder: |
        - [ ] Given ..., when ..., then ...
        - [ ] Given ..., when ..., then ...
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Technical notes
      description: Relevant constraints, boundaries, dependencies, or links.
  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - Domain
        - Application
        - API
        - Web
        - AI/RAG
        - Infrastructure
        - Documentation
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Suggested priority
      options:
        - P1 - next planned increment
        - P2 - backlog
        - P0 - blocking or critical
    validations:
      required: true
