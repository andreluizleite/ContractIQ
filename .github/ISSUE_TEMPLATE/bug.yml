name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels:
  - "type: bug"
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What behavior is incorrect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the application with...
        2. Open...
        3. Submit...
        4. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add logs, trace identifiers, screenshots, or a minimal example without sensitive data.
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Local Demo, Local AI, or Azure
    validations:
      required: true

