name: contractiq

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:5895949dfcdf308eb0cd31c950c93c14895c77f33fbedfecf1fa511ab1d4bcd2
    environment:
      POSTGRES_DB: ${CONTRACTIQ_POSTGRES_DB:-contractiq}
      POSTGRES_USER: ${CONTRACTIQ_POSTGRES_USER:-contractiq}
      POSTGRES_PASSWORD: ${CONTRACTIQ_POSTGRES_PASSWORD:-contractiq}
    ports:
      - "127.0.0.1:${CONTRACTIQ_POSTGRES_PORT:-5432}:5432"
    volumes:
      - contractiq-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama:
    image: ollama/ollama:0.40.14@sha256:ebaef4f4c5d93660e1f25f8ad085a112f51ccfb0e8458073e71793959dba91c9
    profiles: ["local-ai"]
    ports:
      - "127.0.0.1:${CONTRACTIQ_OLLAMA_PORT:-11434}:11434"
    volumes:
      - contractiq-ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  aspire-dashboard:
    image: ${CONTRACTIQ_ASPIRE_DASHBOARD_IMAGE:-mcr.microsoft.com/dotnet/aspire-dashboard@sha256:55a5a9fb88ddcff91997d6889912a19a1627e3584bd41fa5141c9db5f8376754}
    profiles: ["observability"]
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:${CONTRACTIQ_ASPIRE_DASHBOARD_PORT:-18888}:18888"
      - "127.0.0.1:${CONTRACTIQ_OTLP_GRPC_PORT:-4317}:18889"
      - "127.0.0.1:${CONTRACTIQ_OTLP_HTTP_PORT:-4318}:18890"

volumes:
  contractiq-postgres-data:
  contractiq-ollama-data:
