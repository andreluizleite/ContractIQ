name: contractiq

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0
    environment:
      POSTGRES_DB: ${CONTRACTIQ_POSTGRES_DB:-contractiq}
      POSTGRES_USER: ${CONTRACTIQ_POSTGRES_USER:-contractiq}
      POSTGRES_PASSWORD: ${CONTRACTIQ_POSTGRES_PASSWORD:-contractiq}
    ports:
      - "127.0.0.1:${CONTRACTIQ_POSTGRES_PORT:-5432}:5432"
    volumes:
      - contractiq-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama:
    image: ollama/ollama:0.40.1@sha256:69f27594d8127cb43db1edcafa5e2d3cd8f88bdbc54a2cf3ceb11b8d138a24b1
    profiles: ["local-ai"]
    ports:
      - "127.0.0.1:${CONTRACTIQ_OLLAMA_PORT:-11434}:11434"
    volumes:
      - contractiq-ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  aspire-dashboard:
    image: ${CONTRACTIQ_ASPIRE_DASHBOARD_IMAGE:-mcr.microsoft.com/dotnet/aspire-dashboard@sha256:613f297a274958abd85e7b71664f51fb42b0ddeb697ebd4c159677774433345b}
    profiles: ["observability"]
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:${CONTRACTIQ_ASPIRE_DASHBOARD_PORT:-18888}:18888"
      - "127.0.0.1:${CONTRACTIQ_OTLP_GRPC_PORT:-4317}:18889"
      - "127.0.0.1:${CONTRACTIQ_OTLP_HTTP_PORT:-4318}:18890"

volumes:
  contractiq-postgres-data:
  contractiq-ollama-data:
