name: contractiq

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:ab49524d18df7200b74ac9a475e1db6297fc1eb57da4c214c63d10ecc4b754fa
    environment:
      POSTGRES_DB: ${CONTRACTIQ_POSTGRES_DB:-contractiq}
      POSTGRES_USER: ${CONTRACTIQ_POSTGRES_USER:-contractiq}
      POSTGRES_PASSWORD: ${CONTRACTIQ_POSTGRES_PASSWORD:-contractiq}
    ports:
      - "127.0.0.1:${CONTRACTIQ_POSTGRES_PORT:-5432}:5432"
    volumes:
      - contractiq-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama:
    image: ollama/ollama:0.40.16@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    profiles: ["local-ai"]
    ports:
      - "127.0.0.1:${CONTRACTIQ_OLLAMA_PORT:-11434}:11434"
    volumes:
      - contractiq-ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  aspire-dashboard:
    image: ${CONTRACTIQ_ASPIRE_DASHBOARD_IMAGE:-mcr.microsoft.com/dotnet/aspire-dashboard@sha256:e2b7cf9a4ead932de46c6fa2a289c7d6159cfcf06a51aa65f38253a8fae75407}
    profiles: ["observability"]
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:${CONTRACTIQ_ASPIRE_DASHBOARD_PORT:-18888}:18888"
      - "127.0.0.1:${CONTRACTIQ_OTLP_GRPC_PORT:-4317}:18889"
      - "127.0.0.1:${CONTRACTIQ_OTLP_HTTP_PORT:-4318}:18890"

volumes:
  contractiq-postgres-data:
  contractiq-ollama-data:
